prometheusRule:
  name: cluster-alerts

  labels:
    release: prometheus-operator

  groups:
    - name: cluster-availability
      rules:
        - alert: PrometheusTargetDown
          expr: up == 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: A Prometheus target is down
            description: A scrape target has been unreachable for at least five minutes.

        - alert: KubernetesNodeNotReady
          expr: kube_node_status_condition{condition="Ready",status="true"} == 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: A Kubernetes node is not ready
            description: A node has reported a non-ready condition for at least five minutes.

        - alert: KubernetesPodCrashLooping
          expr: max_over_time(kube_pod_container_status_waiting_reason{reason="CrashLoopBackOff"}[5m]) >= 1
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: A pod container is crash-looping
            description: A container has repeatedly entered CrashLoopBackOff.

        - alert: KubernetesDeploymentReplicasMismatch
          expr: kube_deployment_spec_replicas != kube_deployment_status_replicas_available
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: Deployment replicas are unavailable
            description: A Deployment has not had all its desired replicas available for at least fifteen minutes.

    - name: node-health
      rules:
        - alert: NodeHighCPU
          expr: 100 * (1 - avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5m]))) > 90
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: Node CPU usage is high
            description: A node has sustained CPU utilization above 90 percent for fifteen minutes.

        - alert: NodeHighMemory
          expr: 100 * (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) > 90
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: Node memory usage is high
            description: A node has used more than 90 percent of its available memory for fifteen minutes.
    - name: node-conditions
      rules:
        - alert: KubernetesNodePressure
          expr: kube_node_status_condition{condition=~"MemoryPressure|DiskPressure|PIDPressure",status="true"} == 1
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: Kubernetes node is under pressure
            description: 'Node {{ $labels.node }} has {{ $labels.condition }} active for at least five minutes.'

    - name: pod-health
      rules:
        - alert: KubernetesPodImagePullFailure
          expr: kube_pod_container_status_waiting_reason{reason=~"ImagePullBackOff|ErrImagePull"} == 1
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: Pod cannot pull its container image
            description: 'Container {{ $labels.container }} in pod {{ $labels.namespace }}/{{ $labels.pod }} has image pull failures.'

        - alert: KubernetesPodPendingTooLong
          expr: kube_pod_status_phase{phase="Pending"} == 1
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: Kubernetes pod has been pending too long
            description: 'Pod {{ $labels.namespace }}/{{ $labels.pod }} has remained Pending for at least ten minutes.'

        - alert: KubernetesContainerRestartingFrequently
          expr: increase(kube_pod_container_status_restarts_total[15m]) >= 3
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: Container is restarting frequently
            description: 'Container {{ $labels.container }} in pod {{ $labels.namespace }}/{{ $labels.pod }} has restarted at least three times in fifteen minutes.'

    - name: workload-health
      rules:
        - alert: KubernetesStatefulSetReplicasMismatch
          expr: kube_statefulset_status_replicas_ready < kube_statefulset_replicas
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: StatefulSet has unavailable replicas
            description: 'StatefulSet {{ $labels.namespace }}/{{ $labels.statefulset }} has fewer ready replicas than desired.'

        - alert: KubernetesDaemonSetUnavailable
          expr: kube_daemonset_status_number_unavailable > 0
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: DaemonSet has unavailable pods
            description: 'DaemonSet {{ $labels.namespace }}/{{ $labels.daemonset }} has unavailable pods.'

    - name: storage-health
      rules:
        - alert: KubernetesPersistentVolumeClaimPending
          expr: kube_persistentvolumeclaim_status_phase{phase="Pending"} == 1
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: Persistent volume claim is pending
            description: 'PVC {{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }} has remained Pending for at least ten minutes.'

        - alert: KubernetesPersistentVolumeClaimLost
          expr: kube_persistentvolumeclaim_status_phase{phase="Lost"} == 1
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: Persistent volume claim is lost
            description: 'PVC {{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }} is in Lost state.'
