
{{- if .Values.crsTest.enabled }}
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: coraza-crs-test
  namespace: {{ .Values.crsTest.namespace | quote }}
spec:
  plugin:
    coraza:
      directives:
        - {{ printf "SecRuleEngine %s" .Values.crsTest.engineMode | quote }}
        - "SecDebugLog /dev/stdout"
        - "SecDebugLogLevel 3"
        - "Include @crs-setup.conf.example"
        - "Include @owasp_crs/**.conf"
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: coraza-crs-test
  namespace: {{ .Values.crsTest.namespace | quote }}
spec:
  entryPoints:
    - websecure
  routes:
    - match: {{ printf "Host(`%s`)" .Values.crsTest.hostname | quote }}
      kind: Rule
      priority: 10000
      middlewares:
        - name: coraza-crs-test
      services:
        - name: {{ .Values.crsTest.serviceName | quote }}
          port: {{ .Values.crsTest.servicePort }}
  tls: {}
{{- end }}