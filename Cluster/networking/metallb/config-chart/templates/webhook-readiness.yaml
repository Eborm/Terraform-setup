apiVersion: batch/v1
kind: Job
metadata:
  name: metallb-webhook-readiness
  namespace: {{ .Release.Namespace }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 300

  template:
    metadata:
      labels:
        app.kubernetes.io/name: metallb-webhook-readiness

    spec:
      restartPolicy: Never

      containers:
        - name: wait
          image: curlimages/curl:8.18.0

          command:
            - /bin/sh
            - -c
            - |
              echo "Waiting for MetalLB webhook..."

              for i in $(seq 1 60); do
                if curl \
                  --silent \
                  --insecure \
                  --connect-timeout 2 \
                  --max-time 5 \
                  --output /dev/null \
                  https://metallb-webhook-service.metallb-system.svc:443/; then

                  echo "MetalLB webhook is ready."
                  exit 0
                fi

                echo "Webhook not ready yet ($i/60)..."
                sleep 5
              done

              echo "MetalLB webhook did not become ready within 5 minutes."
              exit 1