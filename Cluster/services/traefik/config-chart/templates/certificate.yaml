apiVersion: v1
kind: ServiceAccount
metadata:
  name: traefik-certificate-wait
  namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: traefik-certificate-wait
  namespace: {{ .Release.Namespace }}
rules:
  - apiGroups:
      - cert-manager.io
    resources:
      - certificates
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - ""
    resources:
      - secrets
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: traefik-certificate-wait
  namespace: {{ .Release.Namespace }}
subjects:
  - kind: ServiceAccount
    name: traefik-certificate-wait
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: traefik-certificate-wait
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: bramwesel-me
  namespace: {{ .Release.Namespace }}
spec:
  secretName: bramwesel-me-tls

  issuerRef:
    name: {{ .Values.issuerName }}
    kind: ClusterIssuer

  dnsNames:
    - {{ .Values.domain | quote }}
    - {{ printf "*.%s" .Values.domain | quote }}

  privateKey:
    rotationPolicy: Always
---
apiVersion: batch/v1
kind: Job
metadata:
  name: traefik-certificate-wait
  namespace: {{ .Release.Namespace }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "10"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 0

  template:
    metadata:
      labels:
        app.kubernetes.io/name: traefik-certificate-wait

    spec:
      restartPolicy: Never

      serviceAccountName: traefik-certificate-wait

      containers:
        - name: kubectl
          image: registry.k8s.io/kubectl:v1.36.0

          command:
            - /bin/sh
            - -c

          args:
            - |
              set -eu

              echo "Waiting for Certificate bramwesel-me to become Ready..."

              kubectl wait \
                --namespace "{{ .Release.Namespace }}" \
                --for=condition=Ready \
                --timeout=900s \
                certificate/bramwesel-me

              echo "Certificate is Ready."

              kubectl get secret bramwesel-me-tls \
                --namespace "{{ .Release.Namespace }}"

              echo "TLS Secret is available."