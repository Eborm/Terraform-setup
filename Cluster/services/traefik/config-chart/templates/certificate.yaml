apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: bramwesel-me
  namespace: {{ .Release.Namespace }}
spec:
  secretName: bramwesel-me-tls

  issuerRef:
    name: {{ .Values.issuerName }}
    kind: ClusterIssuer

  dnsNames:
    - {{ .Values.domain | quote }}
    - {{ printf "*.%s" .Values.domain | quote }}

  privateKey:
    rotationPolicy: Always